services:
  cast-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cast-mcp
    restart: unless-stopped
    # Host network mode is recommended for local mDNS Cast device discovery
    network_mode: host
    environment:
      - REST_PORT=3334
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3334/openapi.json || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
